<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Empresa · Globeco Latam</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-green: #00A86B;
    --brand-green-light: #34D399;
    --brand-green-dark: #059669;
    --brand-blue: #0077B6;
    --brand-blue-light: #38BDF8;
    --brand-blue-dark: #0369A1;
    --brand-teal: #0D9488;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-base: #050a0e;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.07);
      --text-primary: #f0fdf4;
      --text-secondary: rgba(240, 253, 244, 0.65);
      --text-tertiary: rgba(240, 253, 244, 0.35);
      --btn-shadow: rgba(0, 168, 107, 0.3);
      --gradient-1: rgba(0, 168, 107, 0.18);
      --gradient-2: rgba(0, 119, 182, 0.14);
      --gradient-3: rgba(13, 148, 136, 0.1);
      --shine-color: rgba(255, 255, 255, 0.03);
      --divider: rgba(255, 255, 255, 0.08);
      --noise-opacity: 0.025;
      --top-line: rgba(255, 255, 255, 0.12);
      --footer-color: rgba(240, 253, 244, 0.25);
      --tag-bg: rgba(255, 255, 255, 0.05);
      --tag-border: rgba(255, 255, 255, 0.08);
    }
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg-base: #f0faf5;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(0, 80, 60, 0.1);
      --glass-bg: rgba(0, 80, 60, 0.03);
      --glass-border: rgba(0, 80, 60, 0.08);
      --text-primary: #052e16;
      --text-secondary: rgba(5, 46, 22, 0.6);
      --text-tertiary: rgba(5, 46, 22, 0.38);
      --btn-shadow: rgba(0, 119, 182, 0.25);
      --gradient-1: rgba(0, 168, 107, 0.12);
      --gradient-2: rgba(0, 119, 182, 0.1);
      --gradient-3: rgba(13, 148, 136, 0.08);
      --shine-color: rgba(255, 255, 255, 0.4);
      --divider: rgba(0, 80, 60, 0.08);
      --noise-opacity: 0.015;
      --top-line: rgba(255, 255, 255, 0.6);
      --footer-color: rgba(5, 46, 22, 0.3);
      --tag-bg: rgba(0, 80, 60, 0.04);
      --tag-border: rgba(0, 80, 60, 0.1);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-base);
    overflow-x: hidden;
  }

  .bg-gradient { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg-gradient::before {
    content: ''; position: absolute; top: -30%; left: -30%;
    width: 160%; height: 160%;
    background:
      radial-gradient(ellipse at 25% 45%, var(--gradient-1) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 25%, var(--gradient-2) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 80%, var(--gradient-3) 0%, transparent 50%);
    will-change: transform;
    animation: gradientFlow 20s ease-in-out infinite alternate;
  }
  @keyframes gradientFlow {
    0% { transform: translate3d(0,0,0) rotate(0deg); }
    100% { transform: translate3d(3%,-3%,0) rotate(1.5deg); }
  }
  @media (prefers-reduced-motion: reduce) { .bg-gradient::before { animation: none; } }

  .noise {
    position: fixed; inset: 0; z-index: 1;
    opacity: var(--noise-opacity);
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 20px; width: 100%; max-width: 440px;
    animation: fadeInUp 1s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Botón volver */
  .back-btn {
    align-self: flex-start;
    display: flex; align-items: center; gap: 7px;
    padding: 9px 15px 9px 12px;
    border-radius: 100px;
    background: var(--card-bg);
    backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    font-family: inherit; font-size: 13px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .back-btn:hover { transform: translateX(-2px); color: var(--text-primary); }
  .back-btn svg { width: 16px; height: 16px; }

  .company-card {
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 36px 28px 30px;
    position: relative; overflow: hidden;
    animation: cardReveal 1.2s cubic-bezier(0.16,1,0.3,1) 0.15s forwards; opacity: 0;
  }
  @keyframes cardReveal {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .company-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--top-line) 30%, var(--top-line) 70%, transparent);
  }
  .card-shine {
    position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--shine-color), transparent);
    transform: skewX(-15deg); animation: shine 7s ease-in-out infinite; pointer-events: none;
  }
  @keyframes shine { 0%,100% { left: -100%; } 50% { left: 160%; } }

  .logo-hero {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    margin-bottom: 26px;
  }

  /* Logo grande — reemplazar el div interno por <img> */
  .logo-big {
    width: 130px; height: 130px;
    border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 800; letter-spacing: -1px; color: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22);
  }
  .logo-big img { width: 100%; height: 100%; object-fit: contain; border-radius: 30px; }
  .logo-big:has(img) { background: #fff !important; padding: 8px; }
  .logo-gtm { background: linear-gradient(135deg, #059669, #0d9488); }
  .logo-eqa { background: linear-gradient(135deg, #0077B6, #0369A1); }
  .logo-glo { background: linear-gradient(135deg, #0D9488, #38BDF8); }

  .company-title { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .company-legal {
    font-size: 23px; font-weight: 800; color: var(--text-primary);
    text-align: center; line-height: 1.15;
  }
  .company-desc {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    text-align: center; line-height: 1.5; max-width: 300px;
  }

  .group-tag {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 4px; padding: 6px 14px; border-radius: 100px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
  }
  .group-tag span {
    font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(135deg, var(--brand-green), var(--brand-blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .divider { height: 1px; background: var(--divider); margin: 6px 0 22px; }

  .info-grid { display: flex; flex-direction: column; gap: 10px; }

  .info-item {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 14px; border-radius: 15px;
    background: var(--tag-bg); border: 1px solid var(--tag-border);
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  a.info-item:hover { transform: translateY(-1px); background: var(--glass-bg); }

  .info-icon {
    width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .info-icon svg { width: 19px; height: 19px; }
  .icon-ruc  { background: linear-gradient(135deg, #059669, #0d9488); }
  .icon-addr { background: linear-gradient(135deg, #0077B6, #0369A1); }
  .icon-mail { background: linear-gradient(135deg, #0D9488, #38BDF8); }

  .info-content { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .info-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-tertiary);
  }
  .info-value {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    word-break: break-word; line-height: 1.35;
  }

  /* Botón Conoce más (solo Equiandina) */
  .cta-btn {
    display: none;
    align-items: center; justify-content: center; gap: 9px;
    width: 100%;
    margin-top: 22px;
    padding: 15px 20px;
    border-radius: 15px;
    background: linear-gradient(135deg, var(--brand-green), var(--brand-blue));
    color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 700;
    letter-spacing: 0.3px;
    text-decoration: none; cursor: pointer;
    border: none;
    box-shadow: 0 8px 24px var(--btn-shadow);
    transition: transform 0.2s cubic-bezier(0.16,1,0.3,1), box-shadow 0.2s ease;
  }
  .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px var(--btn-shadow); }
  .cta-btn:active { transform: translateY(0); }
  .cta-btn svg { width: 18px; height: 18px; }

  .footer {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding-top: 4px;
  }
  .footer-brand {
    font-size: 11.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(135deg, var(--brand-green), var(--brand-blue));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .footer-credit { font-size: 9.5px; color: var(--footer-color); letter-spacing: 0.8px; font-weight: 500; }
  .footer-credit .wig { font-weight: 700; }

  @media (max-width: 440px) {
    .company-card { padding: 30px 20px 24px; border-radius: 20px; }
    .logo-big { width: 112px; height: 112px; font-size: 36px; border-radius: 26px; }
    .company-legal { font-size: 20px; }
    .container { padding: 16px; }
  }
</style>
</head>

        <div class="info-content">
          <span class="info-label">Correo</span>
          <span class="info-value" id="mail-value"></span>
        </div>
      </a>
    </div>

    <a class="cta-btn" id="cta-btn" href="#" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      Conoce más sobre nosotros
    </a>
  </div>

  <div class="footer">
    <span class="footer-brand">GLOBECO LATAM</span>
    <span class="footer-credit">Designed &amp; Built by <span class="wig">W.I.G</span> · DoA &amp; CTO</span>
  </div>
</div>

  function render() {
    const params = new URLSearchParams(window.location.search);
    const key = (params.get('e') || 'gtm').toLowerCase().trim();
    const emp = EMPRESAS[key] || EMPRESAS.gtm;

    document.title = emp.legal + ' · Globeco Latam';

    const logoBig = document.getElementById('logo-big');
    logoBig.className = 'logo-big ' + emp.logoClass;
    if (emp.logoImg) {
      logoBig.innerHTML = '<img src="' + emp.logoImg + '" alt="' + emp.legal + '">';
    } else {
      logoBig.textContent = emp.mono;
    }

    document.getElementById('company-legal').textContent = emp.legal;
    document.getElementById('company-desc').textContent = emp.desc;
    document.getElementById('ruc-value').textContent = emp.ruc;
    document.getElementById('addr-value').textContent = emp.direccion;

    const mailItem = document.getElementById('mail-item');
    if (emp.correo) {
      document.getElementById('mail-value').textContent = emp.correo;
      mailItem.href = 'mailto:' + emp.correo;
      mailItem.style.display = 'flex';
    } else {
      mailItem.style.display = 'none';
    }

    // Botón "Conoce más" solo si la empresa tiene web
    const cta = document.getElementById('cta-btn');
    if (emp.web) {
      cta.href = emp.web;
      cta.style.display = 'flex';
    } else {
      cta.style.display = 'none';
    }
  }

  render();
</script>
